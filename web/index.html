<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Saksham Bir Singh — Flutter developer (2.5+ yrs). Production ERP for garment manufacturing: analytics dashboards, audit workflows, RFID, HR self-service. Open to new roles.">
  <meta property="og:title" content="Saksham Bir Singh — Flutter Developer">
  <meta property="og:description" content="Interactive retro-OS portfolio: real production Flutter work, live UI demos, resume download.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Saksham Bir Singh">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Saksham Bir Singh — Flutter Developer</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B1020">

  <!-- Loading screen: plain HTML/CSS so it paints instantly, long before Flutter has downloaded -->
  <style>
    html, body { margin: 0; height: 100%; background: #0B1020; }
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      background: radial-gradient(ellipse at 50% 40%, #16213d 0%, #0B1020 60%, #05070d 100%);
      color: #E6EDF7; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .6s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash .hello { color: #8FA0B8; font-size: 12px; letter-spacing: .5em; text-indent: .5em; animation: rise .9s ease both; }
    #splash .name { margin-top: 14px; font-weight: 300; letter-spacing: .32em; text-indent: .32em; font-size: clamp(20px, 5.2vw, 38px); animation: rise .9s .15s ease both; }
    #splash .role { margin-top: 12px; color: #5EEAD4; font-size: 12px; font-weight: 600; letter-spacing: .34em; text-indent: .34em; animation: rise .9s .3s ease both; }
    #splash .bar { position: relative; width: 168px; height: 2px; margin-top: 38px; overflow: hidden; border-radius: 2px; background: rgba(255,255,255,.12); animation: rise .9s .45s ease both; }
    #splash .bar::after { content: ""; position: absolute; top: 0; left: 0; height: 100%; width: 42%; border-radius: 2px; background: #5EEAD4; box-shadow: 0 0 10px #5EEAD4; animation: slide 1.15s ease-in-out infinite; }
    #splash .hint { margin-top: 16px; color: #5b6b85; font-size: 11px; letter-spacing: .2em; animation: rise .9s .6s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(240%); } }
    @media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading portfolio">
    <div class="hello">WELCOME</div>
    <div class="name">SAKSHAM BIR SINGH</div>
    <div class="role">FLUTTER DEVELOPER</div>
    <div class="bar"></div>
    <div class="hint">LOADING PORTFOLIO</div>
  </div>
  <noscript><p style="color:#fff;text-align:center;position:fixed;bottom:24px;left:0;right:0;z-index:10000">This portfolio needs JavaScript.</p></noscript>
  <script>
    // Fade the loading screen out once Flutter draws its first frame (but keep it up long enough to read).
    (function () {
      var shownAt = Date.now();
      window.addEventListener('flutter-first-frame', function () {
        var splash = document.getElementById('splash');
        if (!splash) return;
        setTimeout(function () {
          splash.classList.add('hide');
          setTimeout(function () { splash.remove(); }, 700);
        }, Math.max(0, 900 - (Date.now() - shownAt)));
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
